server:
  port: 8081

spring:
  application:
    name: nac

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://192.168.250.25:33306/ARCHIVES_PUB_DB?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: root
    hikari:
      maximum-pool-size: 100
      minimum-idle: 4

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.saltlux.nac.record,com.saltlux.nac.elecdoc
  configuration:
    map-underscore-to-camel-case: true

document:
  extract:
    base-path: /data/file-data/elec_doc
    image-base-path: /data/file-data/elec_doc/images
    default-transfer-year: 2023
    batch-size: 100
    thread-count: 3
    chunk-size: 3
    file-timeout-seconds: 60
    llm:
      endpoints:
        - http://192.168.250.25:13006/v1/chat/completions
        - http://192.168.250.25:15006/v1/chat/completions
        - http://192.168.250.25:16006/v1/chat/completions
      policy-endpoint: http://192.168.250.25:13006/v1/chat/completions
      event-endpoint: http://192.168.250.25:15006/v1/chat/completions
      activity-endpoint: http://192.168.250.25:16006/v1/chat/completions
      model: local-model
      per-worker-size: 10
      timeout-seconds: 120
      max-content-length: 12000
      max-summary-length: 500
      default-prompt-name: summary

logging:
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul
  file:
    name: logs/nac.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/nac.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 10
      total-size-cap: 2GB
  level:
    root: info
    com.saltlux.nac: info
    com.saltlux.nac.activity.ActivityExtractMapper: info
    com.saltlux.nac.elecdoc.ElecDocMapper: info
    com.saltlux.nac.elecdoc.LlmSummaryMapper: info
    com.saltlux.nac.event.EventExtractMapper: info
    com.saltlux.nac.policy.PolicyExtractMapper: info
    com.saltlux.nac.record.RecordMapper: info
    com.saltlux.nac.subject.SubjectExtractMapper: info
    com.saltlux.nac.subject.SubjectPolicyMapper: info
    org.mybatis: info
    org.apache.ibatis: info
