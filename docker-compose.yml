services:
  mariadb:
    image: mariadb:11.4
    container_name: nac-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ARCHIVES_PUB_DB
      MARIADB_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "33306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb-data:
