services:
  mariadb:
    image: mariadb:11.4
    container_name: nac-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: nac_db
      MARIADB_USER: nac_user
      MARIADB_PASSWORD: nac_password
      MARIADB_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mariadb-data:
